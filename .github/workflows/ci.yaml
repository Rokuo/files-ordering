name: CI                          # shown in the repo's Actions tab

on:                               # WHEN it runs (triggers)
  pull_request:
    branches: [dev]

jobs:                             # WHAT runs; jobs run in parallel
  build_and_testing:                  # job name; can be anything
    name: build and testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable
      - uses: Swatinem/rust-cache@v2 
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
  test_running:
    name: Test on ${{ matrix.os }}  # shown in the Actions tab
    strategy:
      fail-fast: false
      matrix:                       # matrice of virtual machines to run the job on
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}       # WHERE: a brand-new virtual machine from matrix.os
    steps:                          # HOW: in order, top to bottom
      - uses: actions/checkout@v7 # a ready-made "action": clones your repo
      - run: rustup update stable
      - uses: Swatinem/rust-cache@v2 
      - run: cargo test       # a plain shell command