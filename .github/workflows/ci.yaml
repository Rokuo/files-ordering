name: CI                          # shown in the repo's Actions tab

on:                               # WHEN it runs (triggers)
  pull_request:
    branches: [dev]

jobs:                             # WHAT runs; jobs run in parallel
  test:
    name: Test on ${{ matrix.os }}  # shown in the Actions tab
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}       # WHERE: a brand-new virtual machine from matrix.os
    steps:                          # HOW: in order, top to bottom
      - uses: actions/checkout@v7 # a ready-made "action": clones your repo
      - run: cargo test       # a plain shell command